name: Backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "ruff==0.17.5"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://autoflow:ci_only@localhost:5432/autoflow_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: "sqlite:///:memory:"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-rpa.txt
      - run: python -m pip install "pip>=26.2,<27"
      - run: pip install -r requirements-dev.txt -r requirements-rpa.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip check
      - run: pip install pip-audit
      - run: python -m pip_audit --local
      - run: python run_test_suite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            backend/test-results.xml
            backend/coverage.xml
  container:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag autoflow-backend:ci ./backend
      - name: Imagem de produção não contém testes nem ferramentas de desenvolvimento
        run: |
          docker run --rm autoflow-backend:ci sh -c '! test -e tests && ! test -e rpa && ! python -c "import pytest"'
      - name: Smoke test da imagem (migração + /ready)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e AUTOFLOW_API_KEY="$(openssl rand -hex 32)" \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            autoflow-backend:ci \
            sh -c "python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 1
          done
          docker logs api
          exit 1
  rpa-browser:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "pip>=26.2,<27"
      - run: pip install -r requirements-dev.txt -r requirements-rpa.txt
      - run: pip install pip-audit
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip_audit --local
      - run: mkdir -p ../rpa-evidence
      - run: python -m pytest -q tests/test_rpa_browser.py --basetemp=../rpa-evidence/ci
        env:
          RUN_RPA_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpa-browser-evidence
          path: |
            rpa-evidence/ci/**/*.png
            rpa-evidence/ci/**/*.json
            rpa-evidence/ci/**/*.zip
            rpa-evidence/ci/**/*.webm
